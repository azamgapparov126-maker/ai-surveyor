<!doctype html>
<html lang="ru" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка INSON</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<!--
  Админка как отдельный сайт (записка заказчика, 06.10.2026): адрес /admin (и прежний /admin/hub), вход по логину
  и паролю — без сессии guard отправляет на /login?next=/admin, после входа страница возвращается сюда.
  Меню из пяти пунктов: Сотрудники, Продукты, Страховые случаи, Дополнительно (всё прежнее содержимое
  админки — разделы V.<группа>_<раздел> без изменений), Выход. Светлая дизайн-система INSON:
  docs/design/design_system.html, токены docs/design/ds_build/tokens.css (синий INSON, белые карточки, Inter,
  поля 16, кнопки 48). Тёмной темы здесь нет намеренно: заказчик просил «простой светлый сайт».
-->
<style>
/* ===== ui-kit кнопок INSON v1 — один и тот же блок в app/tg.html, app/admin_hub.html, app/login.html =====
   Цвет текста и фона у каждой кнопки задан явно и от темы Telegram не зависит (themeParams к кнопкам не применяются).
   Контраст белого текста: основная — фиолетовый градиент #6D4AE8 → #4B2FC9 (5,5:1 на светлом краю, 8,2:1 на тёмном;
   решение заказчика 28.09.2026); успешная #177A41 — 5,4:1 (фирменный #22A85A даёт 3,1:1, не годится);
   опасная #A4231C — 7,4:1. Высота не меньше 44px. */
:root{--btn-line:#6B7883;--btn-hover:rgba(255,255,255,.06);--focus:#8EA9FF;--link:#8EA9FF}
html[data-theme="light"]{--btn-line:#7A8894;--btn-hover:rgba(16,28,38,.06);--focus:#1D2C8F;--link:#1D2C8F}
.btn{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-sizing:border-box;min-height:44px;width:auto;max-width:100%;margin:0;padding:10px 18px;border:1px solid transparent;border-radius:12px;
  font:700 14px/1.25 var(--sans,system-ui,sans-serif);text-align:center;text-decoration:none;white-space:normal;
  cursor:pointer;transition:background-color .12s,border-color .12s}
.btn svg{flex:none;width:18px;height:18px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-primary,.btn-primary:visited{background:#5B3CD9 linear-gradient(135deg,#6D4AE8 0%,#4B2FC9 100%);border-color:#5B3CD9;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-primary:hover:not(:disabled){background:#4B2FC9 linear-gradient(135deg,#5E3DDB 0%,#3F25B0 100%);border-color:#4B2FC9;color:#FFFFFF}
.btn-primary:active:not(:disabled){background:#3A22A3}
.btn-success,.btn-success:visited{background:#177A41;border-color:#177A41;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-success:hover:not(:disabled){background:#12653A;border-color:#12653A;color:#FFFFFF}
.btn-success:active:not(:disabled){background:#0E5230}
.btn-danger,.btn-danger:visited{background:#A4231C;border-color:#A4231C;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-danger:hover:not(:disabled){background:#8F1D17;border-color:#8F1D17;color:#FFFFFF}
.btn-danger:active:not(:disabled){background:#761712}
.btn-secondary,.btn-secondary:visited{background:transparent;border-color:var(--btn-line);color:var(--ink);-webkit-text-fill-color:var(--ink)}
.btn-secondary:hover:not(:disabled){background:var(--btn-hover);color:var(--ink)}
.btn-secondary:active:not(:disabled){background:var(--btn-hover);border-color:var(--ink)}
.btn-link,.btn-link:visited{background:transparent;border-color:transparent;padding:10px 4px;font-weight:600;
  color:var(--link);-webkit-text-fill-color:var(--link);text-decoration:underline;text-underline-offset:3px}
.btn-link:hover:not(:disabled){text-decoration-thickness:2px;color:var(--link)}
.btn-block{display:flex;width:100%}
.btn-sm{min-height:44px;padding:8px 12px;font-size:13px}
/* ряд действий: внизу карточки справа; на телефоне — на всю ширину, основная кнопка первой (она первая в разметке) */
.actions{display:flex;flex-direction:row-reverse;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:8px;margin-top:16px}
@media (max-width:599px){.actions{flex-direction:column;align-items:stretch}.actions .btn{width:100%}}
/* ===== конец ui-kit ===== */
/* ===== дизайн-система INSON (docs/design/ds_build/tokens.css, светлая) ===== */
:root{
  --bg:#f7f8fb;--surface:#ffffff;--surface-warm:#eef4ff;--fg:#111827;--fg-2:#334155;
  --border:#dbe3ef;--border-soft:#edf2f7;--accent-in:#1D2C8F;--accent-soft:#e6e9f7;
  --success-fg:#157a3f;--success-soft:#e3f5ea;--warn-fg:#b45309;--warn-soft:#fef3d7;--danger-fg:#c62828;--danger-soft:#fde8e8;
  --logo-ins:#1D2C8F;--logo-on:#22A85A;
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --radius-sm:12px;--radius-md:20px;--touch:48px;
  --focus-ring:0 0 0 4px rgba(29,44,143,.22);
  /* имена, которыми пользуются прежние разделы (V.*): те же значения дизайн-системы */
  --paper:var(--bg);--card:var(--surface);--ink:var(--fg);--muted:#5b6b80;--line:var(--border);--soft:#f1f4f9;
  --accent:var(--accent-in);--accent-dim:#16237a;--warn:var(--warn-fg);--stop:var(--danger-fg);--ok:var(--success-fg);
  --sans:var(--font-sans);--mono:var(--font-mono);
  --btn-line:#c3cedd;--btn-hover:rgba(29,44,143,.06);--focus:#1D2C8F;--link:#1D2C8F;
  --side:248px;color-scheme:light}
/* кнопки по дизайн-системе: основная — синий INSON, высота 48 (блок ui-kit выше общий для трёх страниц и не меняется) */
.btn{min-height:var(--touch);border-radius:var(--radius-sm);font:600 15px/1.25 var(--font-sans);padding:12px 20px}
.btn-sm{min-height:44px;padding:8px 14px;font-size:14px}
.btn-primary,.btn-primary:visited{background:var(--accent-in);border-color:var(--accent-in);color:#fff;-webkit-text-fill-color:#fff}
.btn-primary:hover:not(:disabled){background:#16237a;border-color:#16237a}
.btn-primary:active:not(:disabled){background:#111b5f}
.btn-secondary,.btn-secondary:visited{background:var(--surface)}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent-in)}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}

/* --- левое меню --- */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 12px 16px}
.brand{display:flex;flex-direction:column;padding:4px 12px 20px}
.logo{font:800 24px/1 var(--font-sans);letter-spacing:-.02em}.logo b:first-child{color:var(--logo-ins)}.logo b+b{color:var(--logo-on)}
.brand small{font:500 12px/16px var(--font-sans);color:var(--muted);margin-top:4px}
.menu-btn{display:none}
#nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nv{display:flex;align-items:center;gap:12px;width:100%;min-height:var(--touch);padding:0 12px;border:0;border-radius:var(--radius-sm);
  background:none;color:var(--fg-2);font:500 15px/20px var(--font-sans);text-align:left;text-decoration:none;cursor:pointer}
.nv svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--soft)}
.nv.on{background:var(--accent-soft);color:var(--accent-in);font-weight:600}
.nv:focus-visible,.sub a:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.nv .chev{margin-left:auto;width:18px;height:18px;transition:transform .15s}
.nv[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sub{padding:2px 0 8px 10px;border-left:1px solid var(--border);margin:0 0 4px 22px}
.sub h4{font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px 10px}
.sub a{display:block;padding:7px 10px;border-radius:10px;color:var(--fg-2);font:400 14px/20px var(--font-sans);text-decoration:none}
.sub a:hover{background:var(--soft)}.sub a.on{color:var(--accent-in);background:var(--accent-soft);font-weight:600}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border-soft)}
.who{font:400 13px/18px var(--font-sans);color:var(--muted);padding:4px 12px 8px;overflow-wrap:anywhere}

/* --- содержимое --- */
main{padding:32px 32px 64px;min-width:0;max-width:1240px}
.head{margin-bottom:20px}
h1{font:700 26px/32px var(--font-sans);letter-spacing:-.01em;margin:0}
.head .why{font-size:15px;color:var(--muted);max-width:70ch;margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px 24px;margin-bottom:16px;min-width:0}
.card h3{font:600 18px/24px var(--font-sans);margin:0 0 4px}
.card .note{font-size:14px;color:var(--muted);margin:0 0 14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px}
.tile b{display:block;font:600 22px/30px var(--font-mono)}.tile span{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border-soft);vertical-align:top}
th{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap;background:var(--soft)}
td.n,th.n{font-family:var(--font-mono);text-align:right;white-space:nowrap}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--soft)}
.v{display:inline-block;font:600 12px/18px var(--font-sans);border-radius:999px;padding:1px 9px;white-space:nowrap}
.v.ok{background:var(--success-soft);color:var(--success-fg)}
.v.warn{background:var(--warn-soft);color:var(--warn-fg)}
.v.stop{background:var(--danger-soft);color:var(--danger-fg)}
.v.dim{background:var(--soft);color:var(--muted)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 16px;align-items:end}
label{display:flex;flex-direction:column;gap:6px;font:500 14px/20px var(--font-sans);color:var(--fg-2)}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:400 16px/22px var(--font-sans);color:var(--fg);background:var(--surface);border:1px solid var(--btn-line);
  border-radius:var(--radius-sm);padding:12px 14px;width:100%;min-width:0;min-height:var(--touch)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-in);box-shadow:var(--focus-ring)}
input[readonly]{background:var(--soft);color:var(--fg-2)}
input[type="checkbox"]{min-height:0;width:auto}
td input,td select{min-height:44px;padding:9px 12px}
.msg{font-size:14px;color:var(--muted);margin-top:10px;min-height:1em}
.msg.bad{color:var(--danger-fg)}.msg.good{color:var(--success-fg)}
.msg ul{margin:6px 0 0;padding-left:20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.kv{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:6px 16px;font-size:14px}
.kv span{color:var(--muted)}
.frame{width:100%;height:calc(100vh - 200px);min-height:480px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.hint{font-size:14px;color:var(--muted);margin:0 0 8px}
.flag{border-left:3px solid var(--warn-fg);background:var(--warn-soft);padding:8px 12px;border-radius:0 10px 10px 0;color:var(--warn-fg);font-size:14px;margin:0 0 12px}
.flag.bad{border-color:var(--danger-fg);background:var(--danger-soft);color:var(--danger-fg)}
.scroll.tall{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.scroll.tall thead th{position:sticky;top:0;z-index:1}
tr.row-bad td{background:var(--danger-soft)}tr.row-warn td{background:var(--warn-soft)}
td.notes{min-width:220px}td.notes span{display:block}td.notes .err{color:var(--danger-fg)}td.notes .wrn{color:var(--warn-fg)}td.notes .chg{color:var(--muted)}
tr.tot td{font-weight:700;border-top:2px solid var(--border)}
tr.edit td{background:var(--surface-warm)}
td.ctl{min-width:250px}td.ctl .btn{margin:0 4px 4px 0}
#sTable td.ctl{min-width:300px;white-space:nowrap}
.form{max-width:980px}
td.nw{white-space:nowrap}
.tile.bad b{color:var(--danger-fg)}
.secret{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:14px 0 0;padding:14px 16px;border:1px dashed var(--warn-fg);border-radius:var(--radius-sm);background:var(--warn-soft)}
.secret code{font:600 24px var(--font-mono);letter-spacing:.08em;user-select:all;word-break:break-all;color:var(--fg)}
.secret .flag{background:none;padding:0 0 0 10px}
.seg{display:inline-flex;flex-wrap:wrap}
.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:10px 0 0 10px;margin-left:0}.seg .btn:last-child{border-radius:0 10px 10px 0}
.seg .btn[aria-pressed="true"]{border-color:var(--accent-in);color:var(--accent-in);-webkit-text-fill-color:var(--accent-in);background:var(--accent-soft);position:relative}

/* --- новые разделы: сотрудники, продукты, страховые случаи --- */
fieldset{border:0;margin:0 0 4px;padding:0;min-width:0}
legend{font:600 13px/18px var(--font-sans);color:var(--muted);padding:0;margin-bottom:8px;letter-spacing:.02em}
.form{display:grid;gap:16px}
.row1{display:grid;grid-template-columns:minmax(0,1fr);gap:12px 16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.form .go{justify-self:start;min-width:180px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;align-items:start}
.tbl-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between;margin-bottom:12px}
.tbl-head h3{margin:0}
.tbl-head label{width:min(360px,100%)}
.count{font:500 14px var(--font-sans);color:var(--muted)}
.years{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end}
.years label{width:160px}
.ytag{display:inline-block;font:600 12px/18px var(--font-sans);color:var(--accent-in);background:var(--accent-soft);border-radius:999px;padding:2px 10px;margin-right:8px;vertical-align:2px}
td.pname{color:var(--fg-2);min-width:180px;padding-top:20px}
td.del{width:56px}
.iconbtn{min-height:44px;min-width:44px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--danger-soft);color:var(--danger-fg)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.iconbtn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
details.files-sub{margin-top:14px}
details.files-sub summary{cursor:pointer;font-size:14px;color:var(--fg-2);min-height:32px}
.actions.left{flex-direction:row;justify-content:flex-start}
#pWork:empty{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;padding:8px 16px;border-right:0;border-bottom:1px solid var(--border)}
  .brand{flex-direction:row;align-items:center;gap:10px;padding:0;min-height:48px}
  .brand small{margin:0}
  .menu-btn{display:inline-flex;position:absolute;right:16px;top:10px}
  #nav{display:none;padding:8px 0 4px;max-height:calc(100vh - 70px);overflow-y:auto}
  body.nav-open #nav{display:flex}
  main{padding:20px 16px 48px}
  h1{font-size:22px;line-height:28px}
  .card{padding:16px}
  .row2,.row3,.split{grid-template-columns:minmax(0,1fr)}
  .frame{height:calc(100vh - 220px)}
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"><b>INS</b><b>ON</b></span><small>Админка сюрвейера</small></div>
    <button class="btn btn-secondary btn-sm menu-btn" id="menuBtn" type="button" aria-controls="nav" aria-expanded="false">Меню</button>
    <nav id="nav" aria-label="Разделы админки"></nav>
  </aside>
  <main id="main">
    <div class="head"><h1 id="title">Админка</h1><p class="why" id="why"></p></div>
    <div id="view"></div>
  </main>
</div>

<script src="/i18n.js"></script>
<script>
"use strict";
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var $ = function (s) { return document.querySelector(s); };
var num = function (n) { return n == null || n === "" ? "—" : Math.round(Number(n)).toLocaleString("ru-RU"); };
var pct = function (n) { return n == null ? "—" : Number(n).toFixed(3).replace(".", ",") + "%"; };
var when = function (s) { return esc(String(s || "").replace("T", " ").slice(0, 16)); };

/* «Дополнительно»: прежние разделы админки без изменений. kind:"frame" — готовая страница во встроенном окне (тот же домен, сессия — cookie sid). */
var NAV = [
 {id:"people", icon:"◉", short:"Люди", title:"Люди",
  why:"Кто работает в системе, кто ждёт подтверждения и кто когда входил.",
  items:[
   {id:"users",   title:"Пользователи", why:"Список работников и заведение новых: ФИО, департамент, отдел, должность, телефон, почта, способ входа, роль; правка карточки и сброс пароля."},
   {id:"pending", title:"Заявки на вход", why:"Заявки, поданные логином и паролем. Подтверждение открывает доступ."},
   {id:"logins",  title:"Журнал входов", why:"Строки журнала действий, где действие начинается со слова «вход»."}]},
 {id:"requests", icon:"❑", short:"Запросы", title:"Запросы и согласования",
  why:"Расчёты филиалов, их карточки и работа согласующих.",
  items:[
   {id:"list",      title:"Запросы и сводка", why:"Сводка по всем запросам и последние тридцать строк."},
   {id:"card",      title:"Карточка запроса", why:"Расчёт, проверки, документы, распознанные поля, согласующие, выгрузки."},
   {id:"approvals", title:"Согласования", kind:"frame", src:"/approvals",
    why:"Готовая страница согласований: «ждут меня», лента решений, генеральные соглашения."}]},
 {id:"tariffs", icon:"₌", short:"Тарифы", title:"Тарифы и справочники",
  why:"Всё, из чего складывается ставка: версии, минимумы, коэффициенты, справочники, нормы износа.",
  items:[
   {id:"forms",     title:"Версии, ставки, продукты", why:"Формы админки: версия тарифов, минимальная ставка, коэффициент, продукт; много продуктов сразу — из Excel."},
   {id:"minrates",  title:"Минимальные ставки страховщика", why:"Минимальная ставка и тип ставки по каждому продукту: правка в строке новой версией с датой начала, история версий, импорт из Excel с предпросмотром."},

/* ------------------------------------------------------------------ обмен */
async function api(path, options) {
  var r = await fetch(path, Object.assign({headers: {Accept: "application/json"}}, options || {}));
  var body = null;
  try { body = await r.json(); } catch (e) { body = null; }
  if (!r.ok) {
    var dd = body && body.detail, d = "";
    if (typeof dd === "string") d = dd;
    else if (dd && dd.message) d = dd.message + (Array.isArray(dd.errors) && dd.errors.length ? ": " + dd.errors.join("; ") : "");
    else if (dd) d = JSON.stringify(dd);
    if (!d && body && body.errors && typeof body.errors === "object") {   /* 422 с ошибками по полям */
      d = Object.keys(body.errors).map(function (k) { return k + ": " + body.errors[k]; }).join("; ");
    }
    if (r.status === 401) d = d || "Нужно войти в систему";
    if (r.status === 403) d = d || "Раздел открыт только администратору";
    throw new Error(d || ("сервер ответил " + r.status));
  }
  return body;
}
async function send(path, method, data) {
  return api(path, {method: method, headers: {"Content-Type": "application/json", Accept: "application/json"},
                    body: JSON.stringify(data || {})});
}
function fail(e) {
  return '<div class="card"><h3>Раздел не загрузился</h3><p class="note">Причина: ' + esc(e.message || e) +
         '.</p><p class="note">Что сделать: обновите страницу; если сказано про вход — войдите заново ' +
         'на <a href="/login">странице входа</a>; если раздел открыт только администратору — попросите админа.</p></div>';
}
function tbl(head, rows, empty, cls) {
  return '<div class="scroll' + (cls ? " " + cls : "") + '"><table><thead><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
    "</tr></thead><tbody>" + (rows.length ? rows.join("") :
    '<tr><td colspan="' + head.length + '">' + (empty || "Записей пока нет") + "</td></tr>") + "</tbody></table></div>";
}
function frame(src, title) {
  var sep = src.indexOf("?") >= 0 ? "&" : "?";
  return '<p class="hint">Раздел открыт как есть — той же страницей, что и отдельным адресом ' +
         '<a href="' + esc(src) + '" target="_blank" rel="noopener">' + esc(src) + '</a>.</p>' +
         '<iframe class="frame" src="' + esc(src + sep + "embed=1") + '" title="' + esc(title) + '" loading="lazy"></iframe>';
}

/* Заведение сотрудника вручную, правка карточки и сброс пароля (app/staff.py, 02.10.2026).
   Временный пароль сервер отдаёт один раз — показываем крупно и нигде не храним. */
var STAFF_FIELDS = [["full_name", "ФИО", true, "Иванов Иван Иванович"], ["position", "Должность", true, "андеррайтер"],
  ["department", "Департамент", true, "андеррайтинг"], ["unit", "Отдел", false, "имущество"],
  ["branch", "Филиал", false, "Ташкент"], ["phone", "Телефон", true, "+998 90 123 45 67"]];
var STAFF_NAMES = {};
STAFF_FIELDS.forEach(function (f) { STAFF_NAMES[f[0]] = f[1].toLowerCase(); });
function staff_inputs(u) {
  return STAFF_FIELDS.map(function (f) {
    var v = u ? (u[f[0]] || "") : (f[0] === "phone" ? "+998 " : "");
    return "<label>" + f[1] + (f[2] ? "" : " (необязательно)") + '<input name="' + f[0] + '" value="' + esc(v) + '"' +
      (f[2] ? " required" : "") + (f[0] === "phone" ? ' type="tel" inputmode="tel"' : "") +
      ' placeholder="' + esc(f[3]) + '" autocomplete="off"></label>';
  }).join("");
}
function staff_secret(login, pw, what) {
  return '<div class="secret" role="status"><div><div class="hint" style="margin:0">' + esc(what) + " · логин <b>" + esc(login) +
    "</b></div><code>" + esc(pw) + "</code></div>" +
    '<button class="btn btn-secondary btn-sm" type="button" data-copy="' + esc(pw) + '">Скопировать пароль</button>' +
    '<p class="flag" style="flex-basis:100%;margin:0">Пароль показывается один раз. Передайте его сотруднику лично, ' +
    "не пересылайте в общих чатах. При первом входе сотрудник задаст свой пароль.</p></div>";
}
function copy_text(t, btn) {
  var done = function () { btn.textContent = "Скопировано"; };
  var by_hand = function () {
    var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "Выделите пароль и скопируйте вручную"; }
    a.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, by_hand);
  else by_hand();
}

        } catch (err) { em.className = "msg bad"; em.textContent = "Не сохранилось: " + err.message; }

  };

async function tpl_save() {

  m.textContent = "Сохраняем…";
  var r, body = null;
  try {
    r = await fetch("/act/templates/" + encodeURIComponent(c), {method: "PUT",
      headers: {"Content-Type": "application/json", Accept: "application/json"},
      body: JSON.stringify({template: tpl, note: $("#tplNote").value.trim(), lang: TPLS.lang})});
    try { body = await r.json(); } catch (e) { body = null; }
  } catch (e) { m.className = "msg bad"; m.textContent = "Сервер не ответил — версия не сохранена. Повторите позже."; return; }

  }
  if (!r.ok) {

    m.textContent = "Версия не сохранена: " + (body && body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) :
      r.status === 403 ? "нужны права администратора" : "сервер ответил " + r.status) + ".";
    return;
  }
  await tpl_one();
  var m2 = $("#tplMsg");
  if (m2) m2.textContent = "Сохранено: версия " + (body && body.version ? body.version : "") + ". История обновлена.";
}

/* --- Загрузка из Excel: общее для продуктов и страховых случаев (app/product_import.py, app/claims_import.py) ---
   Порядок один: файл → предпросмотр с ошибками по строкам → «Применить» по token. Записываются только строки без ошибок. */
async function upload_xlsx(path, file) {
  var fd = new FormData(); fd.append("file", file);
  var r = await fetch(path, {method: "POST", body: fd, headers: {Accept: "application/json"}});
  var b = null; try { b = await r.json(); } catch (e) { b = null; }
  if (!r.ok) {
    var d = b && b.detail ? (typeof b.detail === "string" ? b.detail : JSON.stringify(b.detail)) : "";
    if (r.status === 401) d = d || "Нужно войти в систему";
    if (r.status === 403) d = d || "Загрузка открыта только администратору";
    throw new Error(d || ("сервер ответил " + r.status));
  }
  return b;
}
var IMP_ACT = {create: ["ok", "создать"], update: ["warn", "обновить"], skip: ["dim", "без изменений"]};
function imp_act(it) {
  if (it.errors && it.errors.length) return '<span class="v stop">ошибка</span>';
  var a = IMP_ACT[it.action] || ["dim", it.action || "—"];
  return '<span class="v ' + a[0] + '">' + esc(a[1]) + "</span>";
}
function imp_row(it) {
  return it.errors && it.errors.length ? '<tr class="row-bad">' : it.warnings && it.warnings.length ? '<tr class="row-warn">' : "<tr>";
}
function imp_notes(it) {
  var out = (it.errors || []).map(function (x) { return '<span class="err">' + esc(x) + "</span>"; })
    .concat((it.warnings || []).map(function (x) { return '<span class="wrn">' + esc(x) + "</span>"; }))
    .concat((it.changes || []).map(function (x) { return '<span class="chg">' + esc(x) + "</span>"; }));
  return out.length ? out.join("") : '<span class="hint">—</span>';
}
function imp_tiles(list) {
  return '<div class="tiles" style="margin-top:12px">' + list.map(function (t) {
    return '<div class="tile' + (t[2] ? " " + t[2] : "") + '"><b>' + esc(t[0]) + "</b><span>" + esc(t[1]) + "</span></div>";
  }).join("") + "</div>";
}
function money(n) { return n == null || n === "" ? "—" : num(n) + " сум"; }
function ratio(x) { return x == null ? "—" : (Number(x) * 100).toFixed(1).replace(".", ",") + "%"; }
function ddmm(s) { var p = String(s || "").slice(0, 10).split("-"); return esc(p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : (s || "—")); }

/* Страховые резервы по периодам (app/finance.py): вручную или файлом Excel, предпросмотр, замена с историей. */
var FIN = {st: null, preview: null};
function fin_parse(s) {                      /* «1 250 000,50» → 1250000.5; пусто → null; не число → NaN */
  s = String(s == null ? "" : s).replace(/[\s  ]/g, "").replace(",", ".");
  return s === "" ? null : (/^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN);
}
function fin_fmt(input) {                    /* разделители тысяч прямо в поле */
  var v = input.value.replace(/[^\d,.]/g, "").replace(".", ","), p = v.split(",");
  var int = p[0].replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  input.value = p.length > 1 ? int + "," + p.slice(1).join("").slice(0, 2) : int;
}
function fin_money(n) { return n == null ? "—" : Number(n).toLocaleString("ru-RU", {maximumFractionDigits: 2}); }
async function fin_call(path, method, data) {  /* как send, но отдаёт и код ответа: 409 — «заменить?» */
  var r = await fetch(path, {method: method, headers: {"Content-Type": "application/json", Accept: "application/json"},
                             body: data ? JSON.stringify(data) : undefined});
  var b = null; try { b = await r.json(); } catch (e) { b = null; }
  return {status: r.status, body: b};
}
function fin_err(b, status) {
  var d = b && b.detail;
  if (d && typeof d === "object") return esc(d.message || "") + (d.errors ? "<ul>" + d.errors.map(function (x) {
    return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "");
  return esc(d || ("сервер ответил " + status));
}
function fin_period() {
  var y = Number($("#finYear").value), t = $("#finType").value;
  if (!Number.isInteger(y) || y < FIN.st.year_min || y > FIN.st.year_max)
    throw new Error("Год — целое число от " + FIN.st.year_min + " до " + FIN.st.year_max);
  return {period_year: y, period_type: t};
}
async function fin_save(payload, msg) {
  msg.className = "msg"; msg.textContent = "Сохраняем…";
  var r = await fin_call("/finance/reserves", "POST", payload);
  if (r.status === 409 && r.body && r.body.detail && r.body.detail.existing) {
    var ex = r.body.detail.existing;
    var ok = window.confirm(r.body.detail.message + "\n\nСейчас сохранено: итог " + fin_money(ex.total) + " сум, внёс " +
      (ex.created_by || "—") + " " + String(ex.created_at || "").replace("T", " ").slice(0, 16) +
      ".\nСтарая версия останется в истории.");
    if (!ok) { msg.textContent = "Не сохранено: оставили прежний отчёт."; return false; }
    payload.replace = true;
    r = await fin_call("/finance/reserves", "POST", payload);
  }
  if (r.status !== 200) { msg.className = "msg bad"; msg.innerHTML = "Не сохранилось: " + fin_err(r.body, r.status); return false; }
  msg.textContent = "Сохранено. Итог резервов: " + fin_money(r.body.total) + " сум" + (r.body.replaced ? " (прежняя версия — в истории)." : ".");
  fin_list();
  return true;
}

function bind_forms(el) {
  el.querySelectorAll("form.f[data-url]").forEach(function (f) {
    f.onsubmit = async function (e) {
      e.preventDefault();
      var d = {}, msg = f.nextElementSibling;
      new FormData(f).forEach(function (v, k) {
        if (v === "") return;
        d[k] = (isNaN(v) || k.slice(-4) === "code" || k === "name" || k === "classes") ? v : Number(v);
      });
      if (d.classes) d.classes = String(d.classes).split(",").map(function (s) { return s.trim(); });
      msg.className = "msg"; msg.textContent = "Сохраняем…";
      try {
        var j = await send(f.dataset.url, f.dataset.m, d);
        msg.textContent = "Сохранено." + (j && j.id ? " ID: " + j.id : "");
        f.reset();
      } catch (err) { msg.className = "msg bad"; msg.textContent = "Не сохранилось: " + err.message; }
    };
  });
}

function staff_field(f, u) {
  var k = f[0], v = u ? (u[k] || "") : (k === "phone" ? "+998 " : "");
  var extra = k === "phone" ? ' type="tel" inputmode="tel"' : k === "login" ? ' autocapitalize="off" spellcheck="false"' +

  return "<label><span>" + f[1] + (f[2] || k === "temp_password" ? "" : " <small>(необязательно)</small>") +
    (k === "temp_password" ? " <small>(временный)</small>" : "") + "</span>" +
    '<input name="' + k + '" value="' + esc(v) + '"' + (f[2] && !(u && k === "login") ? " required" : "") + extra +
    ' placeholder="' + esc(f[3]) + '" autocomplete="off"></label>';
}
function staff_form_html(u) {
  return STAFF_FORM.map(function (g) {
    var fs = g[1].filter(function (f) { return !(u && (f[0] === "login" || f[0] === "temp_password")); });
    return '<div class="row' + (u && g[0] === "Вход" ? 3 : fs.length) + '">' + fs.map(function (f) { return staff_field(f, u); }).join("") + "</div>";

      b.closest("tr").after(tr);
      tr.querySelector("input").focus();
      tr.querySelector("form").onsubmit = async function (ev) {
        ev.preventDefault();
        var f = ev.target, em = tr.querySelector(".msg"), diff = {};
        ["full_name", "position", "department", "unit", "branch", "phone"].forEach(function (k) {

        em.className = "msg"; em.textContent = "Сохраняем…";

        } catch (err) { em.className = "msg bad"; em.textContent = "Не сохранилось: " + err.message + "."; }

    } catch (err) { m.className = "msg bad"; m.textContent = "Пароль не сброшен: " + err.message + "."; }

/* ---------- 2. Продукты ---------- */
/* Добавление — те же точки, что у прежней карточки «Новый продукт»: POST /admin/products (код, название, классы,
   текст тарифа «0,05%»; продукт создаётся в статусе «тест»), затем минимальная ставка и тип ставки — новой версией
   PUT /reference/min-rates/{код} с сегодняшней датой (app/min_rates.py). Тип ставки хранится вместе с минимумом. */
var PRD = {items: [], q: ""};
var PRD_TYPE = {annual: "годовая", fixed: "фиксированная"};
function prd_num(s) {
  s = String(s == null ? "" : s).replace(/[\s  ]/g, "").replace(",", ".");
  return s === "" ? null : (/^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN);
}
function prd_pct(n) { return n == null ? "—" : String(Number(n)).replace(".", ",") + "%"; }
async function prd_load() {
  var rows = await api("/reference/products"), mr = {};
  try { (await api("/reference/min-rates")).items.forEach(function (x) { mr[x.code] = x; }); } catch (e) { mr = {}; }
  PRD.items = rows.map(function (p) {
    var m = mr[p.code] || {};
    return {code: p.code, name: p.name, classes: p.classes || "", rate: p.rate_text || "", status: p.status || "",
            min: m.min_rate_pct, type: m.min_rate_pct == null ? null : m.rate_type, statutory: m.editable === false};
  });
}
function prd_table() {
  var box = $("#prdTable"); if (!box) return;
  var q = PRD.q.toLowerCase();
  var rows = PRD.items.filter(function (p) {
    return !q || String(p.code).toLowerCase().indexOf(q) >= 0 || String(p.name || "").toLowerCase().indexOf(q) >= 0 ||
      String(p.classes).split(",").indexOf(q) >= 0;
  });
  $("#prdCount").textContent = rows.length === PRD.items.length ? "всего " + rows.length : "найдено " + rows.length + " из " + PRD.items.length;
  box.innerHTML = tbl(["Код", "Название", "Классы", 'Ставка', "Тип ставки", 'Минимум'],
    rows.map(function (p) {
      return "<tr><td class=\"nw\">" + esc(p.code) + "</td><td>" + esc(p.name) +
        (p.status === "тест" ? ' <span class="v warn" title="Новый продукт: до утверждения виден только андеррайтеру">тест</span>' : "") +
        "</td><td>" + esc(String(p.classes).split(",").join(", ") || "—") + '</td><td class="n">' + esc(p.rate || "—") + "</td><td>" +
        (p.statutory ? '<span class="v dim">по нормативному акту</span>' : esc(p.type ? PRD_TYPE[p.type] || p.type : "—")) +
        '</td><td class="n">' + (p.statutory ? "—" : prd_pct(p.min)) + "</td></tr>";
    }), PRD.q ? "Продуктов не найдено — измените поиск" : "Продуктов пока нет", "tall");
}
V.main_products = async function (el) {
  await prd_load();
  el.innerHTML = '<div class="split"><div class="card"><h3>Добавить страховой продукт</h3>' +
    '<p class="note">Новый продукт создаётся в статусе «тест»: до утверждения его видит только андеррайтер. Минимальная ставка и тип ' +
    "ставки записываются версией с сегодняшней датой — прежние расчёты остаются на своих ставках.</p>" +
    '<form class="form" id="prdAdd" autocomplete="off">' +
    '<div class="row2"><label>Код продукта<input name="code" required placeholder="0836" spellcheck="false"></label>' +
    '<label>Название<input name="name" required placeholder="Страхование имущества предприятий"></label></div>' +
    '<div class="row3"><label>Тариф, ставка %<input name="rate" inputmode="decimal" placeholder="0,15"></label>' +
    '<label>Тип ставки<select name="rate_type"><option value="annual">годовая</option><option value="fixed">фиксированная</option></select></label>' +
    '<label>Минимальная ставка, %<input name="min" inputmode="decimal" placeholder="0,05"></label></div>' +
    '<div class="row1"><label>Классы <small>через запятую, например 8, 13</small><input name="classes" required placeholder="8" spellcheck="false"></label></div>' +
    '<button class="btn btn-primary go" type="submit">Добавить</button></form><div class="msg" id="prdMsg" role="status"></div></div>' +
    '<div class="card" id="pImp"><h3>Импорт из Excel</h3>' +
    '<p class="note">Когда продуктов много: скачайте шаблон, заполните и загрузите. Сначала покажем, что изменится, — в справочник ' +
    "запишем только после «Применить» и только строки без ошибок. Из справочника ничего не удаляется.</p>" +
    '<div class="bar"><a class="btn btn-secondary" href="/reference/products/template.xlsx" download>Скачать шаблон</a>' +
    '<button class="btn btn-primary" type="button" id="pPick">Загрузить</button>' +
    '<input type="file" id="pFile" accept=".xlsx,.xlsm" hidden></div></div></div>' +
    '<div id="pWork" class="card"></div>' +
    '<div class="card"><div class="tbl-head"><div><h3>Продукты</h3><span class="count" id="prdCount"></span></div>' +
    '<label>Поиск<input id="prdQ" placeholder="код, название или класс" value="' + esc(PRD.q) + '"></label></div>' +
    '<div id="prdTable"></div></div>';
  prd_table();
  $("#prdQ").oninput = function (e) { PRD.q = e.target.value.trim(); prd_table(); };
  /* импорт: те же функции, что в прежней админке (prod_preview); после «Применить» prod_list зовёт PRODUCTS_CHANGED */
  $("#pPick").onclick = function () { $("#pFile").value = ""; $("#pFile").click(); };
  $("#pFile").onchange = async function () {
    var f = this.files[0], w = $("#pWork");
    if (!f) return;
    w.innerHTML = '<p class="hint">Разбираем файл «' + esc(f.name) + "»…</p>";
    try { prod_preview(await upload_xlsx("/reference/products/import", f)); }
    catch (e) { w.innerHTML = '<p class="flag bad">Файл не принят: ' + err_text(e) + ". Проверьте, что это шаблон из кнопки «Скачать шаблон», и загрузите снова.</p>"; }
  };
  PRODUCTS_CHANGED = async function () { try { await prd_load(); prd_table(); } catch (e) { /* таблица останется прежней */ } };
  var add = $("#prdAdd");
  add.onsubmit = async function (e) {
    e.preventDefault();
    var m = $("#prdMsg"), f = add.elements;
    var code = f.code.value.trim(), name = f.name.value.trim(), rate = prd_num(f.rate.value), min = prd_num(f.min.value);
    var classes = f.classes.value.split(/[,;\s]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var bad = [];
    if (!code) bad.push("укажите код продукта");
    if (!name) bad.push("укажите название");
    if (!classes.length) bad.push("укажите хотя бы один класс");
    if (rate !== null && (isNaN(rate) || rate > 100)) bad.push("тариф — число от 0 до 100, например 0,15");
    if (min !== null && (isNaN(min) || min > 100)) bad.push("минимальная ставка — число от 0 до 100, например 0,05");
    m.className = "msg";
    if (bad.length) { m.className = "msg bad"; m.textContent = "Продукт не добавлен: " + bad.join("; ") + "."; return; }
    var same = PRD.items.filter(function (p) { return p.code === code; })[0];
    if (same && !confirm("Продукт с кодом " + code + " уже есть: «" + same.name + "».\n\nЗаменить его название, классы и тариф? " +
                         "Статус станет «тест».")) { m.textContent = "Не добавлено: продукт с таким кодом остался как был."; return; }
    m.textContent = "Добавляем продукт…";
    try {
      await send("/admin/products", "POST", {code: code, name: name, classes: classes,
        rate_text: rate === null ? "" : String(rate).replace(".", ",") + "%"});
    } catch (err) { m.className = "msg bad"; m.textContent = "Продукт не добавлен: " + err.message + "."; return; }
    var tail = "";
    if (min !== null) {
      try {
        await send("/reference/min-rates/" + encodeURIComponent(code), "PUT", {min_rate_pct: min, rate_type: f.rate_type.value,
          effective_from: today_iso(), note: "задано при добавлении продукта"});
        tail = " Минимальная ставка " + prd_pct(min) + ", " + PRD_TYPE[f.rate_type.value] + ", действует с сегодняшнего дня.";
      } catch (err) {
        m.className = "msg bad";
        m.textContent = "Продукт " + code + " добавлен, но минимальная ставка не записана: " + err.message +
          ". Задайте её в «Дополнительно → Минимальные ставки страховщика».";
        PRODUCTS_CHANGED(); return;
      }
    } else if (f.rate_type.value === "fixed") {
      tail = " Тип ставки не записан: он хранится вместе с минимальной ставкой — укажите её, когда она будет известна.";
    }
    m.className = "msg good";
    m.textContent = "Продукт " + code + " «" + name + "» добавлен в статусе «тест»." + tail;
    add.reset();
    PRD.q = code; $("#prdQ").value = code;
    PRODUCTS_CHANGED();
  };
};

/* ---------- 3. Страховые случаи ---------- */
/* Ручной ввод — итог года по продукту (число случаев и сумма выплат): GET/PUT /claims/yearly (app/claims_import.py).
   Сервер раскладывает итог на строки claims — по одной на случай, — поэтому сводка и калибровка видят ровно
   введённые число и сумму. Файл Excel — построчные дела (GET /claims/template.xlsx, POST /claims/import → apply). */
var CY = {years: null, data: {}, products: null};
function cy_default() { var y = new Date().getFullYear(); return [y - 3, y - 2, y - 1]; }
function cy_name(code) {
  var p = (CY.products || []).filter(function (x) { return x.code === code; })[0];
  return p ? p.name : "";
}
function cy_row(y, r) {
  r = r || {};
  return '<tr data-y="' + y + '"><td><input data-f="code" list="cyProducts" value="' + esc(r.product_code || "") +
    '" placeholder="0807" spellcheck="false" aria-label="Код продукта" style="max-width:130px"></td>' +
    '<td class="pname" data-f="name">' + esc(r.product_name || cy_name(r.product_code || "") || "—") + "</td>" +
    '<td><input data-f="cases" inputmode="numeric" value="' + esc(r.cases == null ? "" : r.cases) +
    '" aria-label="Число страховых случаев" style="max-width:150px;text-align:right;font-family:var(--mono)"></td>' +
    '<td><input data-f="amount" class="fin-amt" inputmode="decimal" value="' + esc(r.amount == null ? "" : fin_money(r.amount)) +
    '" aria-label="Сумма, сум" style="text-align:right;font-family:var(--mono)"></td>' +
    '<td class="del"><button class="iconbtn" type="button" data-cydel="1" title="Убрать строку" aria-label="Убрать строку">' + ICON.del + "</button></td></tr>";
}
function cy_block(i) {
  var y = CY.years[i], d = CY.data[y] || {manual: [], files: []};
  var rows = d.manual.length ? d.manual : [{}];
  var files = d.files || [];
  var fc = files.reduce(function (a, x) { return a + x.cases; }, 0), fs = files.reduce(function (a, x) { return a + x.amount; }, 0);
  return '<div class="tbl-head"><h3><span class="ytag">' + (i + 1) + '-й год</span>' + y + "</h3>" +
    '<span class="count">' + (d.manual.length ? "введено продуктов: " + d.manual.length : "ручных данных пока нет") + "</span></div>" +
    '<div class="scroll"><table><thead><tr><th>Код продукта</th><th>Название</th><th>Число страховых случаев</th>' +
    '<th>Сумма, сум</th><th><span class="hint" style="margin:0">&nbsp;</span></th></tr></thead><tbody>' +
    rows.map(function (r) { return cy_row(y, r); }).join("") + "</tbody></table></div>" +
    '<div class="actions left"><button class="btn btn-secondary" type="button" data-cyadd="' + y + '">Добавить строку</button>' +
    '<button class="btn btn-primary" type="button" data-cysave="' + y + '">Сохранить ' + y + " год</button></div>" +
    '<div class="msg" data-cymsg="' + y + '" role="status"></div>' +
    (files.length ? '<details class="files-sub"><summary>Ещё из загруженных файлов за ' + y + " год: " + num(fc) + " случ. на " + money(fs) +
      "</summary>" + tbl(["Код", "Название", 'Случаев', 'Сумма'], files.map(function (x) {
        return "<tr><td>" + esc(x.product_code) + "</td><td>" + esc(x.product_name || "—") + '</td><td class="n">' + num(x.cases) +
          '</td><td class="n">' + money(x.amount) + "</td></tr>"; })) +
      '<p class="hint" style="margin-top:8px">Это построчные дела из Excel. Ручной ввод выше их не заменяет — в сводке они складываются.</p></details>' : "");
}
async function cy_load(i) {
  var box = $("#cyBlock" + i), y = CY.years[i];
  box.innerHTML = '<p class="hint">Загружаем ' + y + " год…</p>";
  try {
    var d = await api("/claims/yearly?years=" + y);
    CY.data[y] = d.years[0];
    box.innerHTML = cy_block(i);
  } catch (e) { box.innerHTML = fail(e); }
}
function cy_read(tr) {
  var g = function (f) { return tr.querySelector('[data-f="' + f + '"]').value.trim(); };
  return {code: g("code"), cases: g("cases"), amount: g("amount")};
}
async function cy_save(y, box) {
  var m = box.querySelector('[data-cymsg="' + y + '"]'), rows = [], bad = [];
  box.querySelectorAll("tbody tr").forEach(function (tr, k) {
    var r = cy_read(tr);
    if (!r.code && !r.cases && !r.amount) return;              /* пустая строка — не ошибка, просто пропускаем */
    var n = r.cases === "" ? NaN : Number(r.cases.replace(/\s/g, "")), a = fin_parse(r.amount);
    var why = [];
    if (!r.code) why.push("нет кода продукта");
    else if (CY.products && !cy_name(r.code)) why.push("кода " + r.code + " нет в справочнике");
    if (!Number.isInteger(n) || n < 0) why.push("число случаев — целое, не меньше 0");
    if (a == null || isNaN(a)) why.push("сумма — число, например 125 000 000");
    if (why.length) bad.push("строка " + (k + 1) + ": " + why.join(", "));
    rows.push({product_code: r.code, cases: n, amount: a});
  });
  m.className = "msg";
  if (bad.length) { m.className = "msg bad"; m.innerHTML = "Год не сохранён — исправьте:<ul>" + bad.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; return; }
  if (!rows.length && !(CY.data[y] && CY.data[y].manual.length)) { m.textContent = "Сохранять нечего: заполните хотя бы одну строку."; return; }
  if (!rows.length && !confirm("Все строки пустые. Удалить ручные данные за " + y + " год?")) return;
  m.textContent = "Сохраняем " + y + " год…";
  try {
    var r = await send("/claims/yearly", "PUT", {year: y, rows: rows});
    var i = CY.years.indexOf(y);
    await cy_load(i);
    var m2 = $("#cyBlock" + i).querySelector('[data-cymsg="' + y + '"]');
    m2.className = "msg good";
    m2.textContent = "Сохранено: " + r.products + " продукт., " + num(r.cases) + " случ." + (r.replaced ? " Прежние ручные данные года заменены." : "");
    claims_summary();
  } catch (e) { m.className = "msg bad"; m.textContent = "Год не сохранён: " + e.message + "."; }
}
V.main_claims = async function (el) {
  CY.years = CY.years || cy_default();
  if (!CY.products) { try { CY.products = (await api("/reference/products")).map(function (p) { return {code: p.code, name: p.name}; }); } catch (e) { CY.products = null; } }
  var now = new Date().getFullYear(), opts = function (sel) {
    var o = ""; for (var y = now; y >= now - 15; y--) o += '<option value="' + y + '"' + (y === sel ? " selected" : "") + ">" + y + "</option>";
    return o;
  };
  CLM.years = 3;
  el.innerHTML = '<datalist id="cyProducts">' + (CY.products || []).map(function (p) {
      return '<option value="' + esc(p.code) + '">' + esc(p.name) + "</option>"; }).join("") + "</datalist>" +
    '<div class="card"><h3>Годы</h3><p class="note">Выберите три года. Для каждого введите по продукту число страховых случаев и сумму выплат ' +
    "или загрузите файл Excel ниже. Сохранение года заменяет его ручные данные; дела из файлов не трогаются.</p>" +
    '<div class="years">' + CY.years.map(function (y, i) {
      return "<label>" + (i + 1) + '-й год<select data-cyyear="' + i + '">' + opts(y) + "</select></label>"; }).join("") + "</div></div>" +
    CY.years.map(function (y, i) { return '<div class="card" id="cyBlock' + i + '"></div>'; }).join("") +
    '<div class="card"><h3>Загрузка из Excel</h3>' +
    '<p class="note">В шаблоне одна строка — одно дело: номер дела, код продукта, дата события, статус, заявлено и выплачено. ' +
    "Повторная загрузка того же номера дела обновляет запись. ФИО, паспорт, телефон и адрес не указывайте — такие колонки не загружаются.</p>" +
    '<div class="bar"><a class="btn btn-secondary" href="/claims/template.xlsx" download>Скачать шаблон</a>' +
    '<button class="btn btn-primary" type="button" id="cPick">Загрузить</button>' +
    '<input type="file" id="cFile" accept=".xlsx,.xlsm" hidden></div><div id="cWork"></div></div>' +
    '<div class="card"><h3>Сводка за 3 года по продуктам</h3><p class="note" id="cPeriod">Загружаем…</p>' +
    '<div id="cSum"></div><p class="hint" id="cNote" style="margin-top:8px"></p>' +
    '<details class="files-sub"><summary>Последние загрузки файлов</summary><div id="cBatches"></div></details></div>';
  CY.years.forEach(function (y, i) { cy_load(i); });
  claims_summary();
  $("#cPick").onclick = function () { $("#cFile").value = ""; $("#cFile").click(); };
  $("#cFile").onchange = async function () {
    var f = this.files[0], w = $("#cWork");
    if (!f) return;
    w.innerHTML = '<p class="hint">Разбираем файл «' + esc(f.name) + "»…</p>";
    try { claims_preview(await upload_xlsx("/claims/import", f)); }
    catch (e) { w.innerHTML = '<p class="flag bad">Файл не принят: ' + err_text(e) + ". Проверьте, что это шаблон из кнопки «Скачать шаблон», и загрузите снова.</p>"; }
  };
  el.onchange = function (e) {
    var s = e.target.closest("select[data-cyyear]");
    if (s) {
      var i = Number(s.dataset.cyyear), y = Number(s.value);
      if (CY.years.indexOf(y) >= 0 && CY.years.indexOf(y) !== i) {
        s.value = CY.years[i];
        alert(y + " год уже выбран в другом блоке. Выберите другой год.");
        return;
      }
      CY.years[i] = y; cy_load(i); return;
    }
  };
  el.oninput = function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.f === "code") {         /* название подставляем в соседнюю ячейку, поле не трогаем */
      var cell = t.closest("tr").querySelector('[data-f="name"]'), nm = cy_name(t.value.trim());
      cell.textContent = nm || (t.value.trim() ? "нет в справочнике" : "—");
    }
  };
  el.addEventListener("focusout", function (e) { if (e.target.classList && e.target.classList.contains("fin-amt")) fin_fmt(e.target); });
  el.onclick = function (e) {
    var b = e.target.closest("[data-cyadd],[data-cysave],[data-cydel]"); if (!b) return;
    if (b.dataset.cydel) {
      var tb = b.closest("tbody"), tr = b.closest("tr");
      if (tb.children.length > 1) tr.remove(); else tr.querySelectorAll("input").forEach(function (x) { x.value = ""; });
      return;
    }
    var y = Number(b.dataset.cyadd || b.dataset.cysave), box = b.closest(".card");
    if (b.dataset.cyadd) {
      box.querySelector("tbody").insertAdjacentHTML("beforeend", cy_row(y, {}));
      var rs = box.querySelectorAll("tbody tr"); rs[rs.length - 1].querySelector("input").focus();
      return;
    }
    cy_save(y, box);
  };
};

    '<button class="nv" type="button" id="logout">' + ICON.exit + "<span>Выход</span></button></div>";
  $("#moreBtn").onclick = function () { MORE_OPEN = !(this.getAttribute("aria-expanded") === "true"); paint_nav(); };
  $("#logout").onclick = async function () {
    try { await send("/auth/logout", "POST", {}); } catch (e) { /* сессия уже закрыта — всё равно уходим на вход */ }
    location.href = "/login?next=" + encodeURIComponent("/admin");
  };
}
var WHO = "";
async function open_section(gid, sid, arg) {
  var s, fn;
  if (gid === "main") {
    s = MAIN.filter(function (x) { return x.id === sid; })[0] || MAIN[0];
    cur = {g: "main", s: s.id};
  } else {
    var g = NAV.filter(function (x) { return x.id === gid; })[0];
    if (!g) return open_section("main", "staff");
    s = g.items.filter(function (x) { return x.id === sid; })[0] || g.items[0];
    cur = {g: g.id, s: s.id};
  }
  if (location.hash !== "#" + cur.g + "/" + cur.s) history.replaceState(null, "", "#" + cur.g + "/" + cur.s);
  document.body.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  paint_nav();
  $("#title").textContent = s.title;
  $("#why").textContent = s.why || "";
  document.title = s.title + " — админка INSON";
  var view = $("#view");
  view.onclick = null; view.onchange = null; view.oninput = null;
  view.replaceWith(view = view.cloneNode(false));         /* снимаем слушатели прежнего раздела (addEventListener) */
  view.innerHTML = '<p class="hint">Загружаем раздел…</p>';
  fn = V[cur.g + "_" + cur.s];
  if (!fn) { view.innerHTML = '<p class="hint">Раздел пока пуст.</p>'; return; }
  try { await fn(view, arg); } catch (e) { view.innerHTML = fail(e); }
  if (window.i18nPaint) window.i18nPaint(view);
}
$("#menuBtn").onclick = function () {
  var on = !document.body.classList.contains("nav-open");
  document.body.classList.toggle("nav-open", on); this.setAttribute("aria-expanded", String(on));
};
window.addEventListener("hashchange", function () {
  var p = location.hash.replace("#", "").split("/");
  if (p[0] && (p[0] !== cur.g || p[1] !== cur.s)) open_section(p[0], p[1]);
});
(function () {
  var p = location.hash.replace("#", "").split("/");
  open_section(p[0] || "main", p[1] || "staff");
  api("/auth/me").then(function (u) { WHO = "Вы вошли: " + (u.full_name || u.login); var w = $("#who"); if (w) w.textContent = WHO; }).catch(function () {});
})();
</script>
