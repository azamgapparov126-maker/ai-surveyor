<!doctype html>
<html lang="ru" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка INSON</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<!--
  Админка как отдельный сайт (записка заказчика, 06.10.2026): адрес /admin (и прежний /admin/hub), вход по логину
  и паролю — без сессии guard отправляет на /login?next=/admin. Меню строго по записке: Сотрудники, Продукты,
  Страховые случаи, Выход. Прежние разделы («Дополнительно») убраны по решению заказчика; отдельные страницы
  (/stats, /calibration, /admin/deploy, /approvals, /law-feed и др.) открываются по своим адресам.
  Светлая дизайн-система INSON: docs/design/ds_build/tokens.css. Тёмной темы здесь нет намеренно.
-->
<style>
/* ===== ui-kit кнопок INSON v1 — один и тот же блок в app/tg.html, app/admin_hub.html, app/login.html =====
   Цвет текста и фона у каждой кнопки задан явно и от темы Telegram не зависит (themeParams к кнопкам не применяются).
   Контраст белого текста: основная — фиолетовый градиент #6D4AE8 → #4B2FC9 (5,5:1 на светлом краю, 8,2:1 на тёмном;
   решение заказчика 28.09.2026); успешная #177A41 — 5,4:1 (фирменный #22A85A даёт 3,1:1, не годится);
   опасная #A4231C — 7,4:1. Высота не меньше 44px. */
:root{--btn-line:#6B7883;--btn-hover:rgba(255,255,255,.06);--focus:#8EA9FF;--link:#8EA9FF}
html[data-theme="light"]{--btn-line:#7A8894;--btn-hover:rgba(16,28,38,.06);--focus:#1D2C8F;--link:#1D2C8F}
.btn{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-sizing:border-box;min-height:44px;width:auto;max-width:100%;margin:0;padding:10px 18px;border:1px solid transparent;border-radius:12px;
  font:700 14px/1.25 var(--sans,system-ui,sans-serif);text-align:center;text-decoration:none;white-space:normal;
  cursor:pointer;transition:background-color .12s,border-color .12s}
.btn svg{flex:none;width:18px;height:18px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-primary,.btn-primary:visited{background:#5B3CD9 linear-gradient(135deg,#6D4AE8 0%,#4B2FC9 100%);border-color:#5B3CD9;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-primary:hover:not(:disabled){background:#4B2FC9 linear-gradient(135deg,#5E3DDB 0%,#3F25B0 100%);border-color:#4B2FC9;color:#FFFFFF}
.btn-primary:active:not(:disabled){background:#3A22A3}
.btn-success,.btn-success:visited{background:#177A41;border-color:#177A41;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-success:hover:not(:disabled){background:#12653A;border-color:#12653A;color:#FFFFFF}
.btn-success:active:not(:disabled){background:#0E5230}
.btn-danger,.btn-danger:visited{background:#A4231C;border-color:#A4231C;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF}
.btn-danger:hover:not(:disabled){background:#8F1D17;border-color:#8F1D17;color:#FFFFFF}
.btn-danger:active:not(:disabled){background:#761712}
.btn-secondary,.btn-secondary:visited{background:transparent;border-color:var(--btn-line);color:var(--ink);-webkit-text-fill-color:var(--ink)}
.btn-secondary:hover:not(:disabled){background:var(--btn-hover);color:var(--ink)}
.btn-secondary:active:not(:disabled){background:var(--btn-hover);border-color:var(--ink)}
.btn-link,.btn-link:visited{background:transparent;border-color:transparent;padding:10px 4px;font-weight:600;
  color:var(--link);-webkit-text-fill-color:var(--link);text-decoration:underline;text-underline-offset:3px}
.btn-link:hover:not(:disabled){text-decoration-thickness:2px;color:var(--link)}
.btn-block{display:flex;width:100%}
.btn-sm{min-height:44px;padding:8px 12px;font-size:13px}
/* ряд действий: внизу карточки справа; на телефоне — на всю ширину, основная кнопка первой (она первая в разметке) */
.actions{display:flex;flex-direction:row-reverse;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:8px;margin-top:16px}
@media (max-width:599px){.actions{flex-direction:column;align-items:stretch}.actions .btn{width:100%}}
/* ===== конец ui-kit ===== */
/* ===== дизайн-система INSON (docs/design/ds_build/tokens.css, светлая) ===== */
:root{
  --bg:#f7f8fb;--surface:#ffffff;--surface-warm:#eef4ff;--fg:#111827;--fg-2:#334155;
  --border:#dbe3ef;--border-soft:#edf2f7;--accent-in:#1D2C8F;--accent-soft:#e6e9f7;
  --success-fg:#157a3f;--success-soft:#e3f5ea;--warn-fg:#b45309;--warn-soft:#fef3d7;--danger-fg:#c62828;--danger-soft:#fde8e8;
  --logo-ins:#1D2C8F;--logo-on:#22A85A;
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --radius-sm:12px;--radius-md:20px;--touch:48px;
  --focus-ring:0 0 0 4px rgba(29,44,143,.22);
  --paper:var(--bg);--card:var(--surface);--ink:var(--fg);--muted:#5b6b80;--line:var(--border);--soft:#f1f4f9;
  --accent:var(--accent-in);--sans:var(--font-sans);--mono:var(--font-mono);
  --btn-line:#c3cedd;--btn-hover:rgba(29,44,143,.06);--focus:#1D2C8F;--link:#1D2C8F;
  --side:248px;color-scheme:light}
/* кнопки по дизайн-системе: основная — синий INSON, высота 48 (блок ui-kit выше общий для трёх страниц и не меняется) */
.btn{min-height:var(--touch);border-radius:var(--radius-sm);font:600 15px/1.25 var(--font-sans);padding:12px 20px}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn-primary,.btn-primary:visited{background:var(--accent-in);border-color:var(--accent-in);color:#fff;-webkit-text-fill-color:#fff}
.btn-primary:hover:not(:disabled){background:#16237a;border-color:#16237a}
.btn-primary:active:not(:disabled){background:#111b5f}
.btn-secondary,.btn-secondary:visited{background:var(--surface)}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent-in)}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}

/* --- левое меню --- */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 12px 16px}
.brand{display:flex;flex-direction:column;padding:4px 12px 20px}
.logo{font:800 24px/1 var(--font-sans);letter-spacing:-.02em}.logo b:first-child{color:var(--logo-ins)}.logo b+b{color:var(--logo-on)}
.brand small{font:500 12px/16px var(--font-sans);color:var(--muted);margin-top:4px}
.menu-btn{display:none}
#nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nv{display:flex;align-items:center;gap:12px;width:100%;min-height:var(--touch);padding:0 12px;border:0;border-radius:var(--radius-sm);
  background:none;color:var(--fg-2);font:500 15px/20px var(--font-sans);text-align:left;text-decoration:none;cursor:pointer}
.nv svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nv:hover{background:var(--soft)}
.nv.on{background:var(--accent-soft);color:var(--accent-in);font-weight:600}
.nv:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border-soft)}
.who{font:400 13px/18px var(--font-sans);color:var(--muted);padding:4px 12px 8px;overflow-wrap:anywhere}

/* --- содержимое --- */
main{padding:32px 32px 64px;min-width:0;max-width:1240px}
h1{font:700 26px/32px var(--font-sans);letter-spacing:-.01em;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px 24px;margin-bottom:16px;min-width:0}
.card h3{font:600 18px/24px var(--font-sans);margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px}
.tile b{display:block;font:600 22px/30px var(--font-mono)}.tile span{font-size:13px;color:var(--muted)}
.tile.bad b{color:var(--danger-fg)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll.tall{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
.scroll.tall thead th{position:sticky;top:0;z-index:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border-soft);vertical-align:top}
th{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap;background:var(--soft)}
td.n,th.n{font-family:var(--font-mono);text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
.v{display:inline-block;font:600 12px/18px var(--font-sans);border-radius:999px;padding:1px 9px;white-space:nowrap}
.v.ok{background:var(--success-soft);color:var(--success-fg)}
.v.warn{background:var(--warn-soft);color:var(--warn-fg)}
.v.stop{background:var(--danger-soft);color:var(--danger-fg)}
.v.dim{background:var(--soft);color:var(--muted)}
tr.row-bad td{background:var(--danger-soft)}tr.row-warn td{background:var(--warn-soft)}
td.notes{min-width:220px}td.notes span{display:block}td.notes .err{color:var(--danger-fg)}td.notes .wrn{color:var(--warn-fg)}td.notes .chg{color:var(--muted)}
tr.edit td{background:var(--surface-warm)}
td.ctl{white-space:nowrap;width:1%}td.ctl .btn+.btn{margin-left:6px}
label{display:flex;flex-direction:column;gap:6px;font:500 14px/20px var(--font-sans);color:var(--fg-2)}
label small{font-weight:400;color:var(--muted)}
input,select{font:400 16px/22px var(--font-sans);color:var(--fg);background:var(--surface);border:1px solid var(--btn-line);
  border-radius:var(--radius-sm);padding:12px 14px;width:100%;min-width:0;min-height:var(--touch)}
input:focus,select:focus{outline:none;border-color:var(--accent-in);box-shadow:var(--focus-ring)}
input[readonly]{background:var(--soft);color:var(--fg-2)}
td input{min-height:44px;padding:9px 12px}
.msg{font-size:14px;color:var(--muted);margin-top:10px;min-height:1em}
.msg.bad{color:var(--danger-fg)}.msg.good{color:var(--success-fg)}
.msg ul{margin:6px 0 0;padding-left:20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:14px;color:var(--muted);margin:0 0 8px}
.flag{border-left:3px solid var(--warn-fg);background:var(--warn-soft);padding:8px 12px;border-radius:0 10px 10px 0;color:var(--warn-fg);font-size:14px;margin:0 0 12px}
.flag.bad{border-color:var(--danger-fg);background:var(--danger-soft);color:var(--danger-fg)}
.secret{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:14px 0 0;padding:14px 16px;border:1px dashed var(--warn-fg);border-radius:var(--radius-sm);background:var(--warn-soft)}
.secret code{font:600 24px var(--font-mono);letter-spacing:.08em;user-select:all;word-break:break-all;color:var(--fg)}
.form{display:grid;gap:12px 16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .go{justify-self:start;min-width:180px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.tbl-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tbl-head h3{margin:0}
.yearpick{display:flex;flex-direction:row;align-items:center;gap:10px;font:600 18px/24px var(--font-sans);color:var(--fg)}
.yearpick select{width:120px;min-height:44px;padding:8px 12px;font-weight:600}
.ytag{display:inline-block;font:600 12px/18px var(--font-sans);color:var(--accent-in);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
td.pname{color:var(--fg-2);min-width:180px;padding-top:20px}
td.del{width:56px}
.iconbtn{min-height:44px;min-width:44px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--danger-soft);color:var(--danger-fg)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.iconbtn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.actions.left{flex-direction:row;justify-content:flex-start}
#pWork:empty,#cWork:empty{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;padding:8px 16px;border-right:0;border-bottom:1px solid var(--border)}
  .brand{flex-direction:row;align-items:center;gap:10px;padding:0;min-height:48px}
  .brand small{margin:0}
  .menu-btn{display:inline-flex;position:absolute;right:16px;top:10px}
  #nav{display:none;padding:8px 0 4px}
  body.nav-open #nav{display:flex}
  main{padding:20px 16px 48px}
  h1{font-size:22px;line-height:28px}
  .card{padding:16px}
  .grid4,.grid3,.grid2,.split{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"><b>INS</b><b>ON</b></span><small>Админка</small></div>

    <nav id="nav" aria-label="Разделы админки"></nav>
  </aside>

    <h1 id="title">Админка</h1>

<script>
"use strict";
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var $ = function (s) { return document.querySelector(s); };
var num = function (n) { return n == null || n === "" ? "—" : Math.round(Number(n)).toLocaleString("ru-RU"); };
var pct = function (n) { return n == null ? "—" : Number(n).toFixed(3).replace(".", ",") + "%"; };

/* ------------------------------------------------------------------ обмен с сервером */
async function api(path, options) {
  var r = await fetch(path, Object.assign({headers: {Accept: "application/json"}}, options || {}));
  var body = null;
  try { body = await r.json(); } catch (e) { body = null; }
  if (!r.ok) {
    var dd = body && body.detail, d = "";
    if (typeof dd === "string") d = dd;
    else if (dd && dd.message) d = dd.message + (Array.isArray(dd.errors) && dd.errors.length ? ": " + dd.errors.join("; ") : "");
    else if (dd) d = JSON.stringify(dd);
    if (!d && body && body.errors && typeof body.errors === "object") {
      d = Object.keys(body.errors).map(function (k) { return k + ": " + body.errors[k]; }).join("; ");
    }
    if (r.status === 401) d = d || "Нужно войти в систему";
    if (r.status === 403) d = d || "Раздел открыт только администратору";
    throw new Error(d || ("сервер ответил " + r.status));
  }
  return body;
}
async function send(path, method, data) {
  return api(path, {method: method, headers: {"Content-Type": "application/json", Accept: "application/json"},
                    body: JSON.stringify(data || {})});
}
async function upload_xlsx(path, file) {
  var fd = new FormData(); fd.append("file", file);
  return api(path, {method: "POST", body: fd});
}
function fail(e) {
  return '<div class="card"><h3>Раздел не загрузился</h3><p class="hint">' + esc(e.message || e) +
         '. Обновите страницу; если просят войти — войдите заново на <a href="/login?next=/admin">странице входа</a>.</p></div>';
}
function tbl(head, rows, empty, cls) {
  return '<div class="scroll' + (cls ? " " + cls : "") + '"><table><thead><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
    "</tr></thead><tbody>" + (rows.length ? rows.join("") :
    '<tr><td colspan="' + head.length + '">' + (empty || "Записей пока нет") + "</td></tr>") + "</tbody></table></div>";
}
function money(n) { return n == null || n === "" ? "—" : num(n) + " сум"; }
function ddmm(s) { var p = String(s || "").slice(0, 10).split("-"); return esc(p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : (s || "—")); }
function today_iso() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function parse_num(s) {                      /* «1 250 000,50» → 1250000.5; пусто → null; не число → NaN */
  s = String(s == null ? "" : s).replace(/[\s  ]/g, "").replace(",", ".");
  return s === "" ? null : (/^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN);
}
function fmt_input(input) {                  /* разделители тысяч прямо в поле */
  var v = input.value.replace(/[^\d,.]/g, "").replace(".", ","), p = v.split(",");
  var int = p[0].replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  input.value = p.length > 1 ? int + "," + p.slice(1).join("").slice(0, 2) : int;
}
function fmt_money(n) { return n == null ? "" : Number(n).toLocaleString("ru-RU", {maximumFractionDigits: 2}); }

/* предпросмотр загрузки Excel: файл → строки с ошибками → «Применить» по token; пишутся только строки без ошибок */
var IMP_ACT = {create: ["ok", "создать"], update: ["warn", "обновить"], skip: ["dim", "без изменений"]};
function imp_act(it) {
  if (it.errors && it.errors.length) return '<span class="v stop">ошибка</span>';
  var a = IMP_ACT[it.action] || ["dim", it.action || "—"];
  return '<span class="v ' + a[0] + '">' + esc(a[1]) + "</span>";
}
function imp_row(it) {
  return it.errors && it.errors.length ? '<tr class="row-bad">' : it.warnings && it.warnings.length ? '<tr class="row-warn">' : "<tr>";
}
function imp_notes(it) {
  var out = (it.errors || []).map(function (x) { return '<span class="err">' + esc(x) + "</span>"; })
    .concat((it.warnings || []).map(function (x) { return '<span class="wrn">' + esc(x) + "</span>"; }))
    .concat((it.changes || []).map(function (x) { return '<span class="chg">' + esc(x) + "</span>"; }));
  return out.length ? out.join("") : "—";
}
function imp_tiles(list) {
  return '<div class="tiles" style="margin-top:12px">' + list.map(function (t) {
    return '<div class="tile' + (t[2] ? " " + t[2] : "") + '"><b>' + esc(t[0]) + "</b><span>" + esc(t[1]) + "</span></div>";
  }).join("") + "</div>";
}
function pick_file(btn, input, box, path, show) {
  btn.onclick = function () { input.value = ""; input.click(); };
  input.onchange = async function () {
    var f = this.files[0];
    if (!f) return;
    box.innerHTML = '<p class="hint">Разбираем файл «' + esc(f.name) + "»…</p>";
    try { show(await upload_xlsx(path, f)); }
    catch (e) { box.innerHTML = '<p class="flag bad">Файл не принят: ' + esc(e.message) + ". Скачайте шаблон, заполните его и загрузите снова.</p>"; }
  };
}

var V = {};
var ICON = {
  staff: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.7.7 2.8 2.4 3 5.2"/></svg>',
  products: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>',
  claims: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  exit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>',

var CY = {years: null, data: {}, products: null};
function cy_default() { var y = new Date().getFullYear(); return [y - 3, y - 2, y - 1]; }
function cy_name(code) {
  var p = (CY.products || []).filter(function (x) { return x.code === code; })[0];

function cy_row(r) {

function cy_years_opts(sel) {

  return o;

function cy_block(i) {
  var y = CY.years[i], d = CY.data[y] || {manual: []};
  var rows = d.manual && d.manual.length ? d.manual : [{}];
  return '<div class="tbl-head"><label class="yearpick"><span class="ytag">' + (i + 1) + '-й год</span>' +

async function cy_save(i) {
  var box = $("#cyBlock" + i), y = CY.years[i], m = box.querySelector("[data-cymsg]"), rows = [], bad = [];
  box.querySelectorAll("tbody tr").forEach(function (tr, k) {
    var g = function (f) { return tr.querySelector('[data-f="' + f + '"]').value.trim(); };
    var code = g("code"), cases = g("cases"), amount = g("amount");
    if (!code && !cases && !amount) return;                    /* пустая строка — пропускаем */
    var n = cases === "" ? NaN : Number(cases.replace(/\s/g, "")), a = parse_num(amount), why = [];
    if (!code) why.push("нет кода продукта");

    if (!Number.isInteger(n) || n < 0) why.push("число случаев — целое, не меньше 0");
    if (a == null || isNaN(a)) why.push("сумма — число, например 125 000 000");

  if (!rows.length && !confirm("Все строки пустые. Удалить данные за " + y + " год?")) return;
  m.textContent = "Сохраняем…";
  try {
    var r = await send("/claims/yearly", "PUT", {year: y, rows: rows});
    cy_load(i, "Сохранено: " + r.products + " продукт., " + num(r.cases) + " случ.");

  $("#cApply").onclick = async function () {
    var m = $("#cMsg"), btn = this;
    btn.disabled = true; m.className = "msg"; m.textContent = "Загружаем…";
    try {
      var r = await send("/claims/import/apply", "POST", {token: b.token});
      m.className = "msg good";
      m.textContent = "Готово: добавлено " + r.created + ", изменено " + r.updated + ", пропущено " + r.skipped + ".";
      $("#cCancel").textContent = "Закрыть";
    } catch (e) {
      btn.disabled = false; m.className = "msg bad";
      m.textContent = "Не загружено: " + e.message + ". Если прошло больше получаса — загрузите файл ещё раз.";
    }
  };
}
V.claims = async function (el) {
  CY.years = CY.years || cy_default();
  if (!CY.products) { try { CY.products = (await api("/reference/products")).map(function (p) { return {code: p.code, name: p.name}; }); } catch (e) { CY.products = null; } }
  el.innerHTML = '<datalist id="cyProducts">' + (CY.products || []).map(function (p) {
      return '<option value="' + esc(p.code) + '">' + esc(p.name) + "</option>"; }).join("") + "</datalist>" +
    CY.years.map(function (y, i) { return '<div class="card" id="cyBlock' + i + '" data-i="' + i + '"></div>'; }).join("") +
    '<div class="card"><h3>Загрузка из Excel</h3>' +
    '<div class="bar"><a class="btn btn-secondary" href="/claims/template.xlsx" download>Скачать шаблон</a>' +
    '<button class="btn btn-primary" type="button" id="cPick">Загрузить файл</button>' +
    '<input type="file" id="cFile" accept=".xlsx,.xlsm" hidden></div></div><div id="cWork" class="card"></div>';
  CY.years.forEach(function (y, i) { cy_load(i); });
  pick_file($("#cPick"), $("#cFile"), $("#cWork"), "/claims/import", claims_preview);
  el.onchange = function (e) {
    var s = e.target.closest("select[data-cyyear]"); if (!s) return;
    var i = Number(s.dataset.cyyear), y = Number(s.value);
    if (CY.years.indexOf(y) >= 0 && CY.years.indexOf(y) !== i) {
      s.value = CY.years[i];
      var m = s.closest(".card").querySelector("[data-cymsg]");
      m.className = "msg bad"; m.textContent = y + " год уже выбран в другом блоке — выберите другой.";
      return;
    }
    CY.years[i] = y; cy_load(i);
  };
  el.oninput = function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.f === "code") {         /* название — в соседнюю ячейку, само поле не трогаем */
      var nm = cy_name(t.value.trim());
      t.closest("tr").querySelector('[data-f="name"]').textContent = nm || (t.value.trim() ? "нет в справочнике" : "—");
    }
  };
  el.addEventListener("focusout", function (e) { if (e.target.classList && e.target.classList.contains("amt")) fmt_input(e.target); });
  el.onclick = function (e) {
    var b = e.target.closest("[data-cyadd],[data-cysave],[data-cydel]"); if (!b) return;
    var card = b.closest(".card"), i = Number(card.dataset.i);
    if (b.dataset.cydel) {
      var tb = b.closest("tbody"), tr = b.closest("tr");
      if (tb.children.length > 1) tr.remove(); else tr.querySelectorAll("input").forEach(function (x) { x.value = ""; });
      return;
    }
    if (b.dataset.cyadd) {
      card.querySelector("tbody").insertAdjacentHTML("beforeend", cy_row({}));
      var rs = card.querySelectorAll("tbody tr"); rs[rs.length - 1].querySelector("input").focus();
      return;
    }
    cy_save(i);
  };
};

/* --------------------------------------------------------------- навигация */
var cur = "staff", WHO = "";
function paint_nav() {
  $("#nav").innerHTML = MAIN.map(function (s) {
    return '<a class="nv' + (cur === s.id ? " on" : "") + '" href="#' + s.id + '"' + (cur === s.id ? ' aria-current="page"' : "") + ">" +
      s.icon + "<span>" + s.title + "</span></a>";
  }).join("") +
    '<div class="foot"><div class="who" id="who">' + esc(WHO) + "</div>" +
    '<button class="nv" type="button" id="logout">' + ICON.exit + "<span>Выход</span></button></div>";
  $("#logout").onclick = async function () {
    try { await send("/auth/logout", "POST", {}); } catch (e) { /* сессия уже закрыта — всё равно уходим на вход */ }
    location.href = "/login?next=" + encodeURIComponent("/admin");
  };
}
async function open_section(id) {
  var s = MAIN.filter(function (x) { return x.id === id; })[0] || MAIN[0];
  cur = s.id;
  if (location.hash !== "#" + cur) history.replaceState(null, "", "#" + cur);
  document.body.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  paint_nav();
  $("#title").textContent = s.title;
  document.title = s.title + " — админка INSON";
  var view = $("#view");
  view.replaceWith(view = view.cloneNode(false));         /* снимаем слушатели прежнего раздела */
  view.innerHTML = '<p class="hint">Загружаем…</p>';
  try { await V[cur](view); } catch (e) { view.innerHTML = fail(e); }
}
$("#menuBtn").onclick = function () {
  var on = !document.body.classList.contains("nav-open");
  document.body.classList.toggle("nav-open", on); this.setAttribute("aria-expanded", String(on));
};
window.addEventListener("hashchange", function () {
  var id = location.hash.replace("#", "").split("/").pop();   /* прежние ссылки #main/staff тоже открываются */
  if (id !== cur) open_section(id);
});
(function () {
  open_section(location.hash.replace("#", "").split("/").pop() || "staff");
  api("/auth/me").then(function (u) { WHO = "Вы вошли: " + (u.full_name || u.login); var w = $("#who"); if (w) w.textContent = WHO; }).catch(function () {});
})();
</script>
